name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check agent api config.py

      - name: Security scan
        run: pip install pip-audit && pip-audit 2>&1 || true

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/agentiq
            git pull origin master
            sudo docker build -t agentiq-api .
            sudo docker stop agentiq-api || true
            sudo docker rm agentiq-api || true
            sudo docker run -d --name agentiq-api --network host --env-file .env agentiq-api \
              uvicorn api.main:app --host 0.0.0.0 --port 8000 --root-path /agentiq
            sudo docker image prune -f
