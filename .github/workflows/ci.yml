name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-agentiq
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
          restore-keys: hf-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio "ruff==0.9.10"

      - name: Pre-download embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Lint
        run: ruff check agent api config.py

      - name: Security scan
        run: |
          # Upgrade pip first -- otherwise pip-audit flags pip's own
          # version (a build tool, not something the service ships), which
          # is noise unrelated to this app's dependency tree.
          pip install --upgrade pip
          pip install pip-audit
          python -m scripts.check_pip_audit

      - name: Build Docker image
        run: docker build -t agentiq-api:${{ github.sha }} .

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    # SSH on the shared host's security group is locked to a single home
    # IP, so the runner (a different IP every run) can't reach port 22 by
    # default. Open it just for this runner's own IP for the life of the
    # job, then close it again even if the deploy fails. Same pattern as
    # evalforge and incident-memory-ai, which share this security group.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SG_ID: sg-0c7f5612c7d11e8f4

    steps:
      - name: Debug AWS credential (temporary)
        run: |
          echo "access key id length: ${#AWS_ACCESS_KEY_ID} (expect 20)"
          echo "secret key length:    ${#AWS_SECRET_ACCESS_KEY} (expect 40)"
          aws sts get-caller-identity || echo "get-caller-identity failed"

      - name: Allow this runner's IP through SSH
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)/32"
          echo "RUNNER_CIDR=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP,Description='CI runner ${{ github.run_id }}'}]"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/agentiq

            # Save running image for rollback
            OLD_IMAGE=$(sudo docker inspect agentiq-api --format='{{.Config.Image}}' 2>/dev/null || echo "")

            # Deploy exact tested commit. Reset first — the RAGAS eval workflow
            # runs on this same box and writes evaluation_results.json locally;
            # a dirty tree would otherwise block this checkout.
            git fetch origin
            git reset --hard HEAD
            git checkout --detach ${{ github.sha }}

            sudo docker build -t agentiq-api:${{ github.sha }} .
            sudo docker stop agentiq-api || true
            sudo docker rm agentiq-api || true
            sudo docker run -d --name agentiq-api --network host --env-file .env \
              agentiq-api:${{ github.sha }} \
              uvicorn api.main:app --host 0.0.0.0 --port 8000 --root-path /agentiq

            # Health check — 12 attempts × 5 s = 60 s window
            for attempt in $(seq 1 12); do
              if curl --fail --silent http://localhost:8000/health; then
                echo "Health check passed on attempt $attempt"
                # `docker image prune -f` only removes dangling images, but every
                # deploy tags a new image by commit SHA, so old deploys are never
                # dangling and pile up until the disk fills. Explicitly drop every
                # tagged agentiq-api image except the one just deployed and the
                # one it replaced (kept for rollback).
                KEEP_IMAGE="agentiq-api:${{ github.sha }}"
                sudo docker images agentiq-api --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
                  if [ "$img" != "$KEEP_IMAGE" ] && [ "$img" != "$OLD_IMAGE" ]; then
                    sudo docker rmi "$img" || true
                  fi
                done
                # Best-effort: buildkit runs its own background GC right after a
                # build, which can hold this lock and make prune fail with "a
                # prune operation is already running" even though the deploy
                # itself succeeded (image already removed above). Non-fatal.
                sudo docker image prune -f || true
                exit 0
              fi
              echo "Attempt $attempt failed, retrying in 5s..."
              sleep 5
            done

            # Rollback to previous image
            echo "Health check failed — rolling back"
            sudo docker logs agentiq-api --tail 50
            sudo docker stop agentiq-api || true
            sudo docker rm agentiq-api || true
            if [ -n "$OLD_IMAGE" ]; then
              sudo docker run -d --name agentiq-api --network host --env-file .env \
                "$OLD_IMAGE" \
                uvicorn api.main:app --host 0.0.0.0 --port 8000 --root-path /agentiq
              echo "Rolled back to $OLD_IMAGE"
            fi
            exit 1

      - name: Revoke this runner's IP from SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" || true
