name: RAGAS Evaluation

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Number of queries to evaluate (max 50)"
        required: false
        default: "50"

jobs:
  ragas-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Run evaluation on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ec2-user/agentiq

            # Pull latest eval code
            git fetch origin main
            git checkout origin/main -- evaluation/ agent/ api/ requirements.txt

            # Install eval deps
            pip install -q -r requirements.txt "ragas>=0.2.0,<0.3.0" datasets 2>&1 | tail -3

            # Run evaluation using API keys from .env on the server
            set -a; source .env; set +a
            python -m evaluation.eval_runner

            echo ""
            echo "===== RESULTS JSON ====="
            cat evaluation/evaluation_results.json
            echo ""
            echo "========================"
