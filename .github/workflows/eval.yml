name: RAGAS Evaluation

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Number of queries to evaluate (max 50)"
        required: false
        default: "50"

permissions:
  contents: write

jobs:
  ragas-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run evaluation on EC2
        id: eval
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          capture_stdout: true
          script: |
            set -e
            cd /home/ec2-user/agentiq

            # Pull latest eval code
            git fetch origin master
            git checkout origin/master -- evaluation/ agent/ api/ retrieval/ tools/ config.py requirements.txt Dockerfile

            # Build the same image production deploys from, so eval runs
            # against the exact dependency versions the live app uses.
            sudo docker build -t agentiq-eval:latest .

            # Bind-mount the eval code and data dirs so results land back on
            # the host filesystem; run as root so `pip install` at runtime
            # can write into the image's site-packages.
            sudo docker run --rm --network host --env-file .env --user root \
              -v "$(pwd)/evaluation:/app/evaluation" \
              -v "$(pwd)/faiss_index:/app/faiss_index" \
              -v "$(pwd)/retrieval/documents:/app/retrieval/documents" \
              agentiq-eval:latest \
              bash -c "pip install -q 'ragas>=0.2.0,<0.3.0' datasets && python -m evaluation.eval_runner"

            echo "===EVAL_RESULTS_JSON_START==="
            cat evaluation/evaluation_results.json
            echo "===EVAL_RESULTS_JSON_END==="

      - name: Extract and commit results
        env:
          EVAL_STDOUT: ${{ steps.eval.outputs.stdout }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import sys

          text = os.environ["EVAL_STDOUT"]
          m = re.search(
              r"===EVAL_RESULTS_JSON_START===\n(.*?)\n===EVAL_RESULTS_JSON_END===",
              text, re.DOTALL,
          )
          if not m:
              print("Could not find results JSON markers in eval output.", file=sys.stderr)
              sys.exit(1)
          with open("evaluation/evaluation_results.json", "w") as f:
              f.write(m.group(1).strip() + "\n")
          PYEOF

          if git diff --quiet evaluation/evaluation_results.json; then
            echo "No change in eval results — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluation/evaluation_results.json
          git commit -m "chore: update RAGAS eval results from workflow run ${{ github.run_id }}"
          git push origin HEAD:master
