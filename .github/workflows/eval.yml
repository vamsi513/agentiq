name: RAGAS Evaluation

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Number of queries to evaluate (max 50)"
        required: false
        default: "50"

permissions:
  contents: write

jobs:
  ragas-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run evaluation on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/ec2-user/agentiq

            # Start from a clean tree — a previous eval run left evaluation_results.json
            # modified and uncommitted, which broke the next deploy's git checkout on
            # this same box. Reset first so this run (and the deploy after it) starts clean.
            git fetch origin master
            git reset --hard origin/master
            git checkout origin/master -- evaluation/ agent/ api/ retrieval/ tools/ config.py requirements.txt Dockerfile

            # Build the same image production deploys from, so eval runs
            # against the exact dependency versions the live app uses.
            sudo docker build -t agentiq-eval:latest .

            # Bind-mount the eval code and data dirs so results land back on
            # the host filesystem; run as root so `pip install` at runtime
            # can write into the image's site-packages.
            sudo docker run --rm --network host --env-file .env --user root \
              -v "$(pwd)/evaluation:/app/evaluation" \
              -v "$(pwd)/faiss_index:/app/faiss_index" \
              -v "$(pwd)/retrieval/documents:/app/retrieval/documents" \
              agentiq-eval:latest \
              bash -c "pip install -q 'ragas>=0.2.0,<0.3.0' datasets && python -m evaluation.eval_runner"

            sudo chmod 644 evaluation/evaluation_results.json

      - name: Fetch results file from EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/eval_key
          chmod 600 ~/.ssh/eval_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/eval_key ec2-user@"$EC2_HOST" \
            'cat /home/ec2-user/agentiq/evaluation/evaluation_results.json' \
            > evaluation/evaluation_results.json
          rm -f ~/.ssh/eval_key
          python3 -c "import json; json.load(open('evaluation/evaluation_results.json'))"

      - name: Reset EC2 working tree
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # The results file is now safely captured above — leave the EC2 box's
          # working tree clean so the deploy workflow's checkout isn't blocked,
          # even if an earlier step in this run failed.
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/eval_key
          chmod 600 ~/.ssh/eval_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/eval_key ec2-user@"$EC2_HOST" \
            'cd /home/ec2-user/agentiq && git fetch origin master && git reset --hard origin/master'
          rm -f ~/.ssh/eval_key

      - name: Commit results
        run: |
          if git diff --quiet evaluation/evaluation_results.json; then
            echo "No change in eval results — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluation/evaluation_results.json
          git commit -m "chore: update RAGAS eval results from workflow run ${{ github.run_id }}"
          git push origin HEAD:master
