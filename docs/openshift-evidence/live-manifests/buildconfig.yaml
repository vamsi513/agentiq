apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  labels:
    build: agentiq
  name: agentiq
  namespace: saduvamsikrishna513-dev
spec:
  failedBuildsHistoryLimit: 5
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: agentiq:latest
  postCommit: {}
  resources:
    limits:
      cpu: '2'
      memory: 8Gi
    requests:
      cpu: '1'
      memory: 2Gi
  runPolicy: Serial
  source:
    binary: {}
    type: Binary
  strategy:
    dockerStrategy: {}
    type: Docker
  successfulBuildsHistoryLimit: 5
  triggers:
  - github:
      secret: REDACTED
    type: GitHub
  - generic:
      secret: REDACTED
    type: Generic
