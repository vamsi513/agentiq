apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentiq-api-hpa
  namespace: agentiq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentiq-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
